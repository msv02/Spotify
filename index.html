<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="icon" href="https://res.cloudinary.com/dbqd8ehhf/image/upload/v1784309603/51rttY7a_9L._h1__cyzfpb.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-links">
                <div class="nav-item active" id="home-link">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </div>
                <div class="nav-item" id="search-link">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Search</span>
                </div>
            </div>

            <div class="library">
                <div class="library-header">
                    <div class="library-title">
                        <i class="fa-solid fa-lines-leaning"></i>
                        <span>Your Library</span>
                    </div>
                    <i class="fa-solid fa-plus add-btn"></i>
                </div>
                
                <div class="library-items">
                    <div class="nav-item" id="my-album-link">
                        <i class="fa-solid fa-compact-disc"></i>
                        <span>My Album</span>
                    </div>
                    <div class="nav-item" id="liked-songs-link">
                        <i class="fa-solid fa-heart"></i>
                        <span>Liked Songs</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="prev-next-btns">
                    <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                
                <div class="search-container" id="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="What do you want to listen to?">
                </div>
                <!-- User/Premium icons removed as requested -->
            </header>

            <div class="content-body">
                <h1 class="greeting">Good evening</h1>
                
                <div class="sections-container">
                    <section class="song-section">
                        <h2>Top Mixes</h2>
                        <div class="song-grid" id="song-grid">
                            <!-- Songs will be injected here by JS -->
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- Now Playing Page (Dedicated Player) -->
    <div class="player-page" id="player-page">
        <header class="player-top">
            <button class="back-btn" id="player-back-btn"><i class="fa-solid fa-chevron-down"></i></button>
            <span>PLAYING FROM YOUR LIBRARY</span>
            <button class="more-btn"><i class="fa-solid fa-ellipsis"></i></button>
        </header>

        <div class="player-content">
            <div class="album-art-container">
                <img src="" alt="Album Art" id="big-album-art">
            </div>
            
            <div class="song-meta">
                <div class="meta-text">
                    <h2 id="big-song-title">Song Title</h2>
                    <p id="big-song-artist">Artist Name</p>
                </div>
                <i class="fa-regular fa-heart big-heart"></i>
            </div>

            <div class="player-controls-container">
                <div class="progress-section">
                    <input type="range" min="0" max="100" value="0" class="big-progress-bar" id="big-progress">
                    <div class="time-info">
                        <span id="big-current-time">0:00</span>
                        <span id="big-duration">0:00</span>
                    </div>
                </div>

                <div class="main-btns">
                    <i class="fa-solid fa-shuffle big-control" id="big-shuffle"></i>
                    <i class="fa-solid fa-backward-step big-control" id="big-prev"></i>
                    <div class="big-play-pause" id="big-play-pause">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <i class="fa-solid fa-forward-step big-control" id="big-next"></i>
                    <i class="fa-solid fa-repeat big-control" id="big-repeat"></i>
                </div>

                <div class="extra-btns">
                    <i class="fa-solid fa-share-nodes"></i>
                    <i class="fa-solid fa-list-ul"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
