<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="nav-links">
                <div class="nav-item active" id="home-link">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </div>
                <div class="nav-item" id="search-link">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Search</span>
                </div>
            </div>

            <div class="library">
                <div class="library-header">
                    <div class="library-title">
                        <i class="fa-solid fa-lines-leaning"></i>
                        <span>Your Library</span>
                    </div>
                    <i class="fa-solid fa-plus add-btn"></i>
                </div>
                
                <div class="library-items">
                    <div class="nav-item" id="my-album-link">
                        <i class="fa-solid fa-compact-disc"></i>
                        <span>My Album</span>
                    </div>
                    <div class="nav-item">
                        <i class="fa-solid fa-heart"></i>
                        <span>Liked Songs</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="prev-next-btns">
                    <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                
                <div class="search-container" id="search-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="What do you want to listen to?">
                </div>
                <!-- User/Premium icons removed as requested -->
            </header>

            <div class="content-body">
                <h1 class="greeting">Good evening</h1>
                
                <div class="sections-container">
                    <section class="song-section">
                        <h2>Top Mixes</h2>
                        <div class="song-grid" id="song-grid">
                            <!-- Songs will be injected here by JS -->
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <!-- Player Bar -->
        <footer class="player-bar">
            <div class="current-song-info">
                <img src="" alt="Album Art" id="player-album-art">
                <div class="song-details">
                    <h4 id="player-song-title">Select a song</h4>
                    <p id="player-song-artist">to start listening</p>
                </div>
                <i class="fa-regular fa-heart heart-icon"></i>
            </div>

            <div class="player-controls">
                <div class="control-btns">
                    <i class="fa-solid fa-shuffle control-icon" id="shuffle"></i>
                    <i class="fa-solid fa-backward-step control-icon" id="prev"></i>
                    <div class="play-pause-btn" id="play-pause">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <i class="fa-solid fa-forward-step control-icon" id="next"></i>
                    <i class="fa-solid fa-repeat control-icon" id="repeat"></i>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar-wrapper">
                        <input type="range" min="0" max="100" value="0" class="progress-bar" id="progress">
                    </div>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="volume-controls">
                <i class="fa-solid fa-microphone"></i>
                <i class="fa-solid fa-list-ul"></i>
                <i class="fa-solid fa-computer"></i>
                <div class="volume-bar-wrapper">
                    <i class="fa-solid fa-volume-high"></i>
                    <input type="range" min="0" max="100" value="70" class="volume-bar" id="volume">
                </div>
            </div>
        </footer>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <div class="mobile-nav-item active" id="mobile-home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="mobile-nav-item" id="mobile-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </div>
        <div class="mobile-nav-item" id="mobile-library">
            <i class="fa-solid fa-lines-leaning"></i>
            <span>Library</span>
        </div>
        <div class="mobile-nav-item" id="mobile-my-album">
            <i class="fa-solid fa-compact-disc"></i>
            <span>My Album</span>
        </div>
    </nav>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
